<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="IT Company створює цифрові стратегії, дизайн продуктів і вебрішення для зростання бізнесу."
    />
    <meta name="theme-color" content="#f4f5f2" />
    <title>IT Company — цифрові рішення для зростання</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #202522;
        background: #f4f5f2;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        scroll-behavior: smooth;
      }

      * { box-sizing: border-box; }
      body { min-width: 320px; margin: 0; }
      a { color: inherit; text-decoration: none; }
      .site-header, .site-footer, .section-wrap, .hero {
        width: min(1160px, calc(100% - 64px));
        margin-inline: auto;
      }
      .site-header {
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #dfe2dc;
      }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 750; letter-spacing: -.04em; }
      .brand-mark { display: grid; width: 29px; height: 29px; place-items: center; border-radius: 9px; background: #b9f36c; font-size: 20px; font-style: italic; }
      .site-nav { display: flex; align-items: center; gap: 34px; color: #656b66; font-size: 13px; }
      .site-nav a:hover, .text-link:hover { color: #202522; }
      .site-nav .nav-cta { padding: 11px 15px; border: 1px solid #d6dad3; border-radius: 6px; color: #202522; }
      .nav-cta span { margin-left: 7px; }
      .hero { min-height: 580px; display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 30px; padding-block: 72px 84px; }
      .hero-copy { max-width: 590px; }
      .eyebrow { margin: 0 0 22px; color: #747b74; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      .status-dot { display: inline-block; width: 7px; height: 7px; margin: 0 8px 1px 0; border-radius: 50%; background: #7bb83b; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { max-width: 610px; margin-bottom: 23px; font-size: clamp(44px, 5.2vw, 68px); font-weight: 600; letter-spacing: -.065em; line-height: 1.02; }
      h1 span, .section-heading h2 span { color: #849184; }
      .hero-description { max-width: 470px; margin-bottom: 30px; color: #747b74; font-size: 15px; line-height: 1.8; }
      .hero-actions { display: flex; align-items: center; gap: 24px; }
      .button { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; gap: 16px; padding: 0 18px; border-radius: 6px; font-size: 12px; font-weight: 650; transition: transform .2s ease, background .2s ease; }
      .button:hover { transform: translateY(-2px); }
      .button-primary { background: #b9f36c; }
      .button-primary:hover { background: #a9e65b; }
      .text-link { color: #737a73; font-size: 12px; }
      .text-link span { margin-left: 7px; }
      .hero-note { display: flex; align-items: center; gap: 10px; margin-top: 55px; color: #858b85; font-size: 11px; }
      .note-line { width: 25px; height: 1px; background: #aab1a8; }
      .hero-art { position: relative; width: min(100%, 450px); aspect-ratio: 1; justify-self: end; display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: #e9ede5; }
      .art-orbit { position: absolute; width: 72%; aspect-ratio: 1; border: 1px solid #c9d1c4; border-radius: 50%; transform: rotate(-32deg) scaleY(.63); }
      .orbit-two { width: 95%; transform: rotate(42deg) scaleY(.62); }
      .art-core { z-index: 1; display: grid; width: 148px; height: 148px; align-content: center; justify-items: center; border: 1px solid #d9e0d3; border-radius: 50%; background: #f4f5f2; box-shadow: 0 18px 50px #8e9c7c26; }
      .art-core > span:first-child { font-size: 42px; font-weight: 650; letter-spacing: -.08em; }
      .core-caption { margin-top: 2px; color: #818a7c; font-size: 9px; line-height: 1.25; text-align: center; }
      .art-tag { position: absolute; z-index: 2; padding: 10px 13px; border: 1px solid #dce1d8; border-radius: 6px; background: #f7f8f5; box-shadow: 0 8px 24px #56634c12; color: #6e766b; font-size: 10px; }
      .art-tag span { margin-left: 10px; color: #76a63b; }
      .tag-top { top: 16%; left: 19%; }
      .tag-side { top: 48%; right: 6%; }
      .tag-bottom { bottom: 17%; left: 25%; }
      .services { padding-block: 28px 100px; }
      .section-heading { margin-bottom: 30px; }
      .section-heading .eyebrow { margin-bottom: 10px; }
      .section-heading h2, .contact h2 { margin-bottom: 0; font-size: clamp(25px, 3vw, 36px); font-weight: 550; letter-spacing: -.055em; }
      .service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      .service-card { position: relative; min-height: 210px; padding: 24px; border: 1px solid #e0e3dd; border-radius: 7px; background: #f8f9f6; }
      .service-number { color: #858c84; font-size: 9px; letter-spacing: .1em; }
      .service-card h3 { margin: 31px 0 10px; font-size: 17px; font-weight: 600; letter-spacing: -.03em; }
      .service-card p { max-width: 280px; margin-bottom: 0; color: #7d847d; font-size: 12px; line-height: 1.65; }
      .card-arrow { position: absolute; top: 21px; right: 22px; color: #7ca946; }
      .contact { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 44px 48px; border-radius: 8px; background: #242b25; color: #f5f7f2; }
      .contact .eyebrow { margin-bottom: 11px; color: #a7b1a3; }
      .button-light { background: #b9f36c; color: #202522; }
      .site-footer { display: flex; justify-content: space-between; gap: 20px; padding-block: 26px 30px; color: #838a82; font-size: 10px; }
      @media (max-width: 760px) {
        .site-header, .site-footer, .section-wrap, .hero { width: min(100% - 40px, 560px); }
        .site-header { height: 72px; }
        .site-nav { gap: 0; }
        .site-nav > a:not(.nav-cta) { display: none; }
        .site-nav .nav-cta { padding: 10px 12px; font-size: 11px; }
        .hero { grid-template-columns: 1fr; gap: 48px; padding-block: 70px 65px; }
        h1 { font-size: clamp(43px, 11vw, 62px); }
        .hero-art { width: min(100%, 390px); justify-self: center; }
        .hero-note { margin-top: 35px; }
        .services { padding-bottom: 65px; }
        .service-grid { grid-template-columns: 1fr; }
        .service-card { min-height: 185px; }
        .service-card h3 { margin-top: 25px; }
        .contact { align-items: flex-start; flex-direction: column; padding: 32px 25px; }
        .site-footer { flex-direction: column; gap: 8px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
